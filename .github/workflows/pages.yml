name: Score and publish

# One workflow, several jobs. `check` guards the dataset and scores it; `visual` is a matrix
# with one job per entry in site/registry.json, each building its own folder of the site
# from the same scored data; `assemble` puts the folders together with the homepage and the
# shared data and deploys. Adding a visual is adding a folder under site/visuals/ and a line
# to the registry; the matrix picks it up without a change here.

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding the `code-change` label re-runs the gate with code allowed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# The pull_request event (never pull_request_target) runs fork code with a read-only token
# and no secrets. Deploy needs more, and only the push job reaches it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time on main; pull requests each get their own group so a PR run never
# cancels a deploy and a deploy never cancels a PR check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      visuals: ${{ steps.registry.outputs.visuals }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dataset gate (pull request)
        if: github.event_name == 'pull_request'
        # Full scan of every data file plus the pull-request rules (append-only, data-only
        # scope), see scoring/check.py. The gate is taken from the BASE branch, not from the
        # PR, so a pull request cannot edit the rules it is judged by. Code changes are let
        # through only for the `code-change` label (a maintainer adds it after reading the
        # code) or for a repository owner/member.
        env:
          ALLOW_CODE: ${{ (contains(github.event.pull_request.labels.*.name, 'code-change') || contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association)) && '--allow-code' || '' }}
        run: |
          git show "origin/${{ github.base_ref }}:scoring/check.py" > "$RUNNER_TEMP/check.py"
          python3 "$RUNNER_TEMP/check.py" --root . --base "origin/${{ github.base_ref }}" $ALLOW_CODE
      - name: Dataset gate (main)
        if: github.event_name != 'pull_request'
        run: python3 scoring/check.py
      - name: Corpus is reproducible from src
        run: |
          python3 corpus/build.py > /dev/null
          git diff --exit-code -- corpus/ || { echo "::error::corpus/ differs from what corpus/build.py generates; run it and commit"; exit 1; }
      - name: Score
        run: python3 scoring/score.py
      - name: Score report for the new runs
        if: github.event_name == 'pull_request'
        run: python3 scoring/report.py --base "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Shared data and homepage
        run: |
          python3 site/build.py data
          python3 site/build.py index
      - uses: actions/upload-artifact@v4
        with: { name: site-base, path: _site, include-hidden-files: true, retention-days: 1 }
      - id: registry
        run: echo "visuals=$(python3 site/build.py list)" >> "$GITHUB_OUTPUT"

  visual:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        visual: ${{ fromJSON(needs.check.outputs.visuals) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scoring/score.py
      - name: Build ${{ matrix.visual }}
        run: python3 site/build.py visual ${{ matrix.visual }}
      - uses: actions/upload-artifact@v4
        with:
          name: visual-${{ matrix.visual }}
          path: _site/${{ matrix.visual }}
          retention-days: 1

  assemble:
    needs: [check, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site-base, path: _site }
      - uses: actions/download-artifact@v4
        with: { pattern: visual-*, path: _site }
      - name: Visual folders take their registry id
        # download-artifact nests each artifact under its name; the site wants _site/<id>/.
        run: |
          cd _site
          for d in visual-*/; do mv "$d" "${d#visual-}"; done
          ls
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
