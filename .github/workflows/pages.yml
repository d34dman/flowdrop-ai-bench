name: Score and publish

# One workflow, several jobs. `check` guards the dataset and scores it; `visual` is a matrix
# with one job per entry in site/registry.json, each building its own folder of the site
# from the same scored data; `assemble` puts the folders together with the homepage and the
# shared data and deploys. Adding a visual is adding a folder under site/visuals/ and a line
# to the registry; the matrix picks it up without a change here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      visuals: ${{ steps.registry.outputs.visuals }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Dataset is append-only
        if: github.event_name == 'pull_request'
        # A contribution adds runs; it never edits or removes one. That is what keeps
        # every PR conflict-free and every published figure reproducible.
        run: |
          changed=$(git diff --name-status --diff-filter=MDRT "origin/${{ github.base_ref }}...HEAD" -- runs outputs traces)
          if [ -n "$changed" ]; then
            echo "$changed" | while read -r st f rest; do echo "::error file=$f::existing run files are never modified, renamed or deleted ($st)"; done
            exit 1
          fi
      - name: Traces are small
        run: |
          big=$(find traces -name '*.json.gz' -size +3M)
          if [ -n "$big" ]; then
            echo "$big" | while read -r f; do echo "::error file=$f::trace exceeds 3 MB"; done
            exit 1
          fi
      - name: Corpus is reproducible from src
        run: |
          python3 corpus/build.py > /dev/null
          git diff --exit-code -- corpus/ || { echo "::error::corpus/ differs from what corpus/build.py generates; run it and commit"; exit 1; }
      - name: Every run has its output
        run: |
          python3 - <<'EOF'
          import json, os, sys
          bad = 0
          for fn in os.listdir('runs'):
              if not fn.endswith('.json'): continue
              r = json.load(open(f'runs/{fn}'))
              for k in ('run_id', 'workflow', 'url_key', 'corpus_version', 'prompt_sha256', 'pipeline_status', 'tag'):
                  if k not in r: print(f'::error file=runs/{fn}::missing {k}'); bad += 1
              if r.get('pipeline_status') == 'completed' and not os.path.exists(f"outputs/{r['run_id']}.md"):
                  print(f'::error file=runs/{fn}::completed run without outputs/{r["run_id"]}.md'); bad += 1
          sys.exit(1 if bad else 0)
          EOF
      - name: Score
        run: python3 scoring/score.py
      - name: Shared data and homepage
        run: |
          python3 site/build.py data
          python3 site/build.py index
      - uses: actions/upload-artifact@v4
        with: { name: site-base, path: _site, include-hidden-files: true, retention-days: 1 }
      - id: registry
        run: echo "visuals=$(python3 site/build.py list)" >> "$GITHUB_OUTPUT"

  visual:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        visual: ${{ fromJSON(needs.check.outputs.visuals) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scoring/score.py
      - name: Build ${{ matrix.visual }}
        run: python3 site/build.py visual ${{ matrix.visual }}
      - uses: actions/upload-artifact@v4
        with: { name: visual-${{ matrix.visual }}, path: _site/${{ matrix.visual }}, retention-days: 1 }

  assemble:
    needs: [check, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: site-base, path: _site }
      - uses: actions/download-artifact@v4
        with: { pattern: visual-*, path: _site }
      - name: Visual folders take their registry id
        # download-artifact nests each artifact under its name; the site wants _site/<id>/.
        run: |
          cd _site
          for d in visual-*/; do mv "$d" "${d#visual-}"; done
          ls
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
