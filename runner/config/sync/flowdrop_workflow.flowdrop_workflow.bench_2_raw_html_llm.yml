              exposed: false
            -
              id: error
        url: 'https://d34dman.github.io/flowdrop-ai-bench/corpus/v1/medium.html'
      metadata:
        node_type_id: http_request
    measured:
      width: 280
      height: 182
  -
    id: flowdrop_ai_provider_chat.1
    position:
      x: 420
      'y': 60
    data:
      label: Chat
      config:
        model: claude-haiku-4-5-20251001
        operation_type: chat
        temperature: 0
        maxTokens: 200000
        systemPrompt: |-
          Convert the ENTIRE page to Markdown. If you are given a URL rather than the page,
          fetch the content at that URL first.

          Reproduce the full document: every heading, paragraph, list item and table, in
          the original order and wording. Do not summarise, abridge, omit or re-word
          anything. Redaction is the only change you may make to the text.

          Redaction: the page discusses Drupal and its competing content management
          products. Replace every mention of the CMS products WordPress, Joomla, Hexagrid,
          Lumen CMS, Marrow and Sitewright with "████". Redact only the product: the same word
          used in another sense (a person, a place, a unit, an ordinary word) is not a
          product and must stay as written. Never redact Drupal.

          Output the Markdown document and nothing else. No code fences, no preamble, no
          commentary, no explanation of what you did.
        maxRetries: 0
        requiresConfirmation: ''
        ports:
          inputs:
            -
              id: message
            -
              id: systemPrompt
              exposed: false
            -
              id: history
              exposed: false
            -
              id: loop_back
            -
              id: trigger
              exposed: false
          outputs:
            -
              id: response
            -
              id: trigger
              exposed: false
            -
              id: error
      metadata:
        node_type_id: flowdrop_ai_provider_chat
    measured:
      width: 280
      height: 262
  -
    id: chat_output.3
    position:
      x: 800
      'y': 140
    data:
      label: 'Chat Output'
      config:
        format: text
        showTimestamp: false
        nodeType: default
        maxRetries: 0
        requiresConfirmation: ''
        ports:
          outputs:
            -
              id: message
            -
              id: format
            -
              id: timestamp
            -
              id: metadata
            -
              id: trigger
              exposed: false
            -
              id: error
          inputs:
            -
              id: message
            -
              id: loop_back
            -
              id: trigger
              exposed: false
      metadata:
        node_type_id: chat_output
    measured:
      width: 280
      height: 242
