parameter_schema:
  type: object
  properties:
    system_prompt:
      type: string
      title: 'System Prompt'
      description: 'Instructions for the agent (its role, when to use which tool, when to stop).'
      format: multiline
      x-data-type: string
      default: ''
    message:
      title: Message
      description: 'The message content.'
      x-data-type: mixed
    tool:
      title: Tools
      x-data-type: tool
    critic_prompt:
      type: string
      title: 'Critic Prompt'
      description: 'Instructions for the critic. Its reply must begin with VERDICT: ACCEPT or VERDICT: REVISE, then give the critique.'
      format: multiline
      x-data-type: string
      default: "You are a strict reviewer. You see exactly two things: the user's request and a draft answer to it. Judge the draft against the request alone: does it fully and correctly answer what was asked? Your reply must begin with exactly one line: VERDICT: ACCEPT if it does, or VERDICT: REVISE if it does not. After a REVISE verdict, list concretely what is wrong or missing and what the next draft must change. Do not write the answer yourself."
output_schema:
  type: object
  properties:
    message:
      type: string
      x-data-type: string
    reason:
      type: string
      x-data-type: string
    critique:
      type: string
      x-data-type: string
