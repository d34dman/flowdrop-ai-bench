        operation_type: chat
        model: claude-haiku-4-5-20251001
        temperature: 0
        maxTokens: 800000
        systemPrompt: "You are a strict reviewer. You see exactly two things: the user's request and a draft answer to it. Judge the draft against the request alone: does it fully and correctly answer what was asked? Your reply must begin with exactly one line: VERDICT: ACCEPT if it does, or VERDICT: REVISE if it does not. After a REVISE verdict, list concretely what is wrong or missing and what the next draft must change. Do not write the answer yourself."
        maxRetries: 0
        requiresConfirmation: ''
        instanceTitle: Critic
        ports:
          inputs:
