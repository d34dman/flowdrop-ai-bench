id: bench_9_reflexion_with_tools_in_parent
label: 'Bench 9 · Reflexion with Tools in Parent'
description: 'Peer of Bench 8. Same tools, same prompt, but the engine is the Reflexion Agent Engine: a critic reviews the final Markdown against the fidelity and redaction rules and sends it back for revision (max 3) before it is emitted.'
