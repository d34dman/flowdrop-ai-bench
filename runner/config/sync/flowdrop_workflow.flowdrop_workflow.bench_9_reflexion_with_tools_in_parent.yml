  -
    id: flowdrop_workflow_reflexion_agent_engine.1
    position:
      x: 380
      'y': -300
    data:
      label: 'Reflexion Agent Engine'
      config:
        system_prompt: |-
          Convert the ENTIRE page to Markdown. If you are given a URL rather than the page,
          fetch the content at that URL first.

          Reproduce the full document: every heading, paragraph, list item and table, in
          the original order and wording. Do not summarise, abridge, omit or re-word
          anything. Redaction is the only change you may make to the text.

          Redaction: the page discusses Drupal and its competing content management
          products. Replace every mention of the CMS products WordPress, Joomla, Hexagrid,
          Lumen CMS, Marrow and Sitewright with "████". Redact only the product: the same word
          used in another sense (a person, a place, a unit, an ordinary word) is not a
          product and must stay as written. Never redact Drupal.

          Output the Markdown document and nothing else. No code fences, no preamble, no
          commentary, no explanation of what you did.
        maxRetries: 0
        requiresConfirmation: ''
        message: 'https://www.hostinger.com/tutorials/drupal-vs-wordpress/'
        critic_prompt: |-
          You are a strict reviewer of a Markdown conversion made by another assistant. The
          conversation above holds the original request and, as the last assistant message, the
          draft output. You did not write the draft; you have no tools and must not try to fetch
          anything; everything you need is already in the conversation. Judge the draft ONLY
          against these rules: (1) it must be the ENTIRE page as Markdown, every heading, paragraph,
          list item and table in original order and wording, nothing summarised or omitted;
          (2) every mention of the CMS products WordPress, Joomla, Hexagrid, Lumen CMS, Marrow and Sitewright must be replaced with "████" and
          no other text may be changed, and the same word used in another sense (a person, a place,
          a unit) must NOT be replaced; (3) Drupal is the subject of the page and must NEVER be
          replaced — a draft that keeps every mention of Drupal as written is correct on that
          point, and you must never ask for Drupal to be redacted; (4) it must contain nothing
          but the Markdown document: no code fences, no preamble, no commentary. URLs, link targets
          and image paths are not text and are outside these rules.

          Your reply must begin with exactly one line: VERDICT: ACCEPT if all four rules hold, or
          VERDICT: REVISE if any is broken. After a REVISE verdict, list concretely which rule is
          broken and where. Do not rewrite the document yourself.
      metadata:
        node_type_id: flowdrop_workflow_reflexion_agent_engine
    measured:
      width: 280
      height: 582
