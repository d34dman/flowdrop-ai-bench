    data:
      label: 'Reason (agent step)'
      config:
        messages: {  }
        operation_type: chat
        model: claude-haiku-4-5-20251001
        temperature: 0
        maxTokens: 200000
        systemPrompt: |-
          Convert the ENTIRE page to Markdown. If you are given a URL rather than the page,
          fetch the content at that URL first.

          Reproduce the full document: every heading, paragraph, list item and table, in
          the original order and wording. Do not summarise, abridge, omit or re-word
          anything. Redaction is the only change you may make to the text.

          Redaction: the page discusses Drupal and its competing content management
          products. Replace every mention of the CMS products WordPress, Joomla, Hexagrid,
          Lumen CMS, Marrow and Sitewright with "████". Redact only the product: the same word
          used in another sense (a person, a place, a unit, an ordinary word) is not a
          product and must stay as written. Never redact Drupal.

          Output the Markdown document and nothing else. No code fences, no preamble, no
          commentary, no explanation of what you did.
        maxRetries: 0
        requiresConfirmation: ''
        ports:
          inputs:
            -
              id: messages
            -
              id: systemPrompt
              exposed: false
            -
              id: tool
              exposed: true
            -
              id: loop_back
              exposed: true
            -
              id: trigger
              exposed: true
          outputs:
            -
              id: tool_calls
              exposed: true
            -
              id: text
            -
              id: has_tool_calls
              exposed: true
            -
              id: assistant_message
              exposed: true
            -
              id: trigger
            -
              id: error
      metadata:
        node_type_id: flowdrop_node_processor_reason
    measured:
      width: 280
      height: 702
