services:
  flowdrop_ai_bench.run_context:
    class: Drupal\flowdrop_ai_bench\BenchRunContext

  flowdrop_ai_bench.ai_context_tag_subscriber:
    class: Drupal\flowdrop_ai_bench\EventSubscriber\AiContextTagSubscriber
    arguments: ['@flowdrop_ai_bench.run_context']
    tags:
      - { name: event_subscriber }

  flowdrop_ai_bench.harness:
    class: Drupal\flowdrop_ai_bench\Service\Harness
    arguments:
      - '@http_client'
      - '@entity_type.manager'
      - '@database'
      - '@uuid'
      - '@account_switcher'
      - '@flowdrop_ai_bench.run_context'
      - '@flowdrop_workflow_executor.launcher'

  # Explicit class aliases so Drush 13's AutowireTrait (which resolves
  # constructor parameters by looking up the container under their type-hint)
  # can find these services regardless of whether Drupal's own container
  # registers a same-name alias for them.
  Drupal\flowdrop_ai_bench\Service\Harness: '@flowdrop_ai_bench.harness'
  Drupal\flowdrop_ai_bench\BenchRunContext: '@flowdrop_ai_bench.run_context'
